<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>About — El Martillo I.T. Ticketing System</title>
<link rel="icon" type="image/png" href="logo.png"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=DM+Mono:wght@400;500&family=DM+Sans:wght@300;400;500&display=swap" rel="stylesheet"/>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --navy:    #0D1B2A;
  --blue:    #185FA5;
  --blue-l:  #2176CC;
  --silver:  #C8D6E5;
  --cream:   #F4F1EB;
  --white:   #FAFAFA;
  --text:    #0D1B2A;
  --text2:   #4A5568;
  --text3:   #8A9BB0;
}

html, body {
  height: 100%;
  font-family: 'DM Sans', sans-serif;
  background: var(--navy);
  color: var(--white);
  overflow-x: hidden;
}

/* ── Background ── */
.bg {
  position: fixed; inset: 0; z-index: 0;
  background:
    radial-gradient(ellipse 80% 60% at 10% 20%, rgba(24,95,165,0.18) 0%, transparent 60%),
    radial-gradient(ellipse 60% 80% at 90% 80%, rgba(24,95,165,0.12) 0%, transparent 60%),
    var(--navy);
}

/* ── Grid lines ── */
.grid-lines {
  position: fixed; inset: 0; z-index: 0; pointer-events: none;
  background-image:
    linear-gradient(rgba(255,255,255,.03) 1px, transparent 1px),
    linear-gradient(90deg, rgba(255,255,255,.03) 1px, transparent 1px);
  background-size: 60px 60px;
}

/* ── Layout ── */
.page {
  position: relative; z-index: 1;
  min-height: 100vh;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 60px 24px;
}

.card {
  width: 100%;
  max-width: 680px;
  text-align: center;
}

/* ── Atom logo ── */
.atom-wrap {
  margin-bottom: 40px;
  opacity: 0;
  transform: scale(0.8);
  animation: fadeUp .8s ease forwards;
}
@keyframes fadeUp {
  to { opacity: 1; transform: scale(1) translateY(0); }
}

/* ── Divider ── */
.divider {
  width: 48px; height: 2px;
  background: linear-gradient(90deg, transparent, var(--blue-l), transparent);
  margin: 28px auto;
  opacity: 0;
  animation: fadeUp .6s ease .6s forwards;
}

/* ── Title ── */
.title {
  font-family: 'DM Serif Display', serif;
  font-size: clamp(28px, 5vw, 42px);
  line-height: 1.15;
  letter-spacing: -.5px;
  color: var(--white);
  opacity: 0;
  animation: fadeUp .7s ease .2s forwards;
}
.title em {
  font-style: italic;
  color: var(--silver);
}

/* ── Subtitle / credit ── */
.credit {
  font-size: 15px;
  font-weight: 300;
  color: var(--silver);
  line-height: 1.7;
  max-width: 480px;
  margin: 0 auto;
  opacity: 0;
  animation: fadeUp .7s ease .4s forwards;
}
.credit strong {
  font-weight: 500;
  color: var(--white);
}
.credit .tool-tag {
  display: inline-block;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  font-weight: 500;
  padding: 2px 8px;
  border-radius: 4px;
  border: 1px solid rgba(24,95,165,.5);
  background: rgba(24,95,165,.15);
  color: var(--silver);
  margin: 0 2px;
  vertical-align: middle;
  letter-spacing: .03em;
}

/* ── Links ── */
.links {
  display: flex;
  gap: 12px;
  justify-content: center;
  flex-wrap: wrap;
  margin-top: 36px;
  opacity: 0;
  animation: fadeUp .7s ease .8s forwards;
}
.link-btn {
  display: inline-flex; align-items: center; gap: 7px;
  padding: 9px 18px;
  font-size: 13px; font-weight: 500;
  font-family: 'DM Sans', sans-serif;
  border-radius: 8px;
  text-decoration: none;
  transition: all .18s;
  cursor: pointer; border: none;
}
.link-btn.primary {
  background: var(--blue);
  color: #fff;
  border: 1px solid var(--blue-l);
}
.link-btn.primary:hover { background: var(--blue-l); }
.link-btn.secondary {
  background: transparent;
  color: var(--silver);
  border: 1px solid rgba(255,255,255,.15);
}
.link-btn.secondary:hover {
  background: rgba(255,255,255,.07);
  color: var(--white);
}

/* ── Footer note ── */
.footnote {
  position: fixed;
  bottom: 20px; left: 0; right: 0;
  text-align: center;
  font-family: 'DM Mono', monospace;
  font-size: 11px;
  color: rgba(255,255,255,.18);
  letter-spacing: .06em;
  z-index: 2;
  opacity: 0;
  animation: fadeUp .5s ease 1.2s forwards;
}

/* ── Animated atom ── */
@keyframes orbitAbout1 { from { offset-distance:0% } to { offset-distance:100% } }
@keyframes orbitAbout2 { from { offset-distance:0% } to { offset-distance:100% } }
@keyframes orbitAbout3 { from { offset-distance:0% } to { offset-distance:100% } }
</style>
</head>
<body>

<div class="bg"></div>
<div class="grid-lines"></div>

<div class="page">
  <div class="card">

    <!-- Animated atom -->
    <div class="atom-wrap">
      <svg width="110" height="84" viewBox="0 0 680 520" xmlns="http://www.w3.org/2000/svg" style="overflow:visible;display:inline-block">
        <ellipse cx="340" cy="260" rx="200" ry="70" fill="none" stroke="#2196F3" stroke-width="5"/>
        <g transform="rotate(60,340,260)">
          <ellipse cx="340" cy="260" rx="200" ry="70" fill="none" stroke="#2196F3" stroke-width="5"/>
        </g>
        <g transform="rotate(120,340,260)">
          <ellipse cx="340" cy="260" rx="200" ry="70" fill="none" stroke="#2196F3" stroke-width="5"/>
        </g>
        <circle cx="340" cy="260" r="38" fill="#1A3A7A"/>
        <circle r="13" fill="none" stroke="#2196F3" stroke-width="4"
          style="offset-path:path('M 140,260 A 200,70 0 1,1 539.9,260 A 200,70 0 1,1 140,260');
                 offset-distance:0%;animation:orbitAbout1 3.5s linear infinite"/>
        <g transform="rotate(60,340,260)">
          <circle r="13" fill="none" stroke="#2196F3" stroke-width="4"
            style="offset-path:path('M 140,260 A 200,70 0 1,1 539.9,260 A 200,70 0 1,1 140,260');
                   offset-distance:33%;animation:orbitAbout2 4.5s linear infinite reverse"/>
        </g>
        <g transform="rotate(120,340,260)">
          <circle r="13" fill="none" stroke="#2196F3" stroke-width="4"
            style="offset-path:path('M 140,260 A 200,70 0 1,1 539.9,260 A 200,70 0 1,1 140,260');
                   offset-distance:66%;animation:orbitAbout3 6s linear infinite"/>
        </g>
      </svg>
    </div>

    <!-- Title -->
    <h1 class="title">El Martillo<br/><em>I.T. Ticketing System</em></h1>

    <div class="divider"></div>

    <!-- Credit -->
    <p class="credit">
      Developed by <strong>Giacomo Medici</strong><br/>
      using <span class="tool-tag">Claude AI</span> and other tools.
    </p>

    <!-- Nav buttons -->
    <div class="links">
      <a href="index.html" class="link-btn primary">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><path d="M15 3h6v6M9 21H3v-6M21 3l-7 7M3 21l7-7"/></svg>
        Client portal
      </a>
      <a href="admin.html" class="link-btn secondary">
        <svg width="14" height="14" fill="none" viewBox="0 0 24 24" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="7" height="7"/><rect x="14" y="3" width="7" height="7"/><rect x="3" y="14" width="7" height="7"/><rect x="14" y="14" width="7" height="7"/></svg>
        Admin panel
      </a>
    </div>

  </div>
</div>

<p class="footnote">EL MARTILLO I.T. &nbsp;·&nbsp; GIBRALTAR</p>

</body>
</html>

<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>El Martillo — Support</title>
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body { font-family: system-ui, -apple-system, sans-serif; background: #f5f4f0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; padding: 2rem 1rem; color: #1a1a1a; }

  .brand-header { display: flex; align-items: center; gap: 12px; margin-bottom: 2rem; }
  .brand-icon { width: 42px; height: 42px; background: #1a1a1a; border-radius: 10px; display: flex; align-items: center; justify-content: center; }
  .brand-icon svg { width: 22px; height: 22px; fill: none; stroke: #fff; stroke-width: 2; stroke-linecap: round; stroke-linejoin: round; }
  .brand-name { font-size: 20px; font-weight: 600; letter-spacing: -0.3px; }
  .brand-sub { font-size: 12px; color: #777; margin-top: 2px; }

  .form-card { background: #fff; border-radius: 14px; border: 1px solid #e8e8e8; padding: 2rem; width: 100%; max-width: 540px; }
  .form-card h2 { font-size: 17px; font-weight: 600; margin-bottom: 4px; }
  .form-card .subtitle { font-size: 13px; color: #777; margin-bottom: 1.5rem; }

  .form-row { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-group { display: flex; flex-direction: column; gap: 5px; margin-bottom: 14px; }
  .form-group label { font-size: 13px; font-weight: 500; color: #444; }
  input, textarea { font-family: inherit; font-size: 14px; border: 1px solid #ddd; border-radius: 8px; padding: 9px 12px; width: 100%; outline: none; transition: border-color 0.15s; background: #fafafa; color: #1a1a1a; }
  input:focus, textarea:focus { border-color: #1a1a1a; background: #fff; }
  textarea { resize: vertical; min-height: 95px; }

  .urgency-row { display: flex; gap: 8px; }
  .urgency-btn { flex: 1; padding: 8px 0; border: 1px solid #ddd; border-radius: 8px; font-size: 13px; cursor: pointer; background: #fafafa; font-family: inherit; color: #555; transition: all 0.15s; }
  .urgency-btn:hover { background: #f0f0f0; }
  .urgency-btn.sel-low    { background: #EAF3DE; color: #3B6D11; border-color: #639922; }
  .urgency-btn.sel-medium { background: #FAEEDA; color: #854F0B; border-color: #BA7517; }
  .urgency-btn.sel-high   { background: #FAECE7; color: #993C1D; border-color: #D85A30; }
  .urgency-btn.sel-critical { background: #FCEBEB; color: #A32D2D; border-color: #E24B4A; }

  .submit-btn { margin-top: 8px; width: 100%; padding: 11px; background: #1a1a1a; color: #fff; border: none; border-radius: 8px; font-size: 14px; font-weight: 500; cursor: pointer; font-family: inherit; transition: opacity 0.15s; }
  .submit-btn:hover { opacity: 0.85; }

  .success-msg { display: none; margin-top: 1rem; background: #EAF3DE; border: 1px solid #639922; border-radius: 10px; padding: 12px 16px; color: #3B6D11; font-size: 14px; }

  .admin-link { margin-top: 1.5rem; font-size: 13px; color: #999; }
  .admin-link a { color: #555; text-decoration: underline; }

  .footer { margin-top: 2rem; font-size: 12px; color: #aaa; display: flex; gap: 20px; flex-wrap: wrap; justify-content: center; }
  .footer a { color: #888; text-decoration: none; }
  .footer a:hover { color: #1a1a1a; }
</style>
</head>
<body>

<div class="brand-header">
  <div class="brand-icon">
    <svg viewBox="0 0 24 24"><path d="M15 4l5 5-9.5 9.5-3 .5.5-3L15 4z"/><path d="M14 5l5 5"/></svg>
  </div>
  <div>
    <div class="brand-name">El Martillo</div>
    <div class="brand-sub">Support &amp; Helpdesk</div>
  </div>
</div>

<div class="form-card">
  <h2>Open a support ticket</h2>
  <p class="subtitle">Fill in the details below and our team will get back to you.</p>

  <div class="form-row">
    <div class="form-group">
      <label for="f-name">Full name</label>
      <input type="text" id="f-name" placeholder="Jane Smith" />
    </div>
    <div class="form-group">
      <label for="f-phone">Telephone</label>
      <input type="tel" id="f-phone" placeholder="+1 555 000 0000" />
    </div>
  </div>

  <div class="form-group">
    <label for="f-email">Email address</label>
    <input type="email" id="f-email" placeholder="jane@company.com" />
  </div>

  <div class="form-group">
    <label for="f-desc">Issue description</label>
    <textarea id="f-desc" placeholder="Describe your issue in as much detail as possible…"></textarea>
  </div>

  <div class="form-group">
    <label>Urgency</label>
    <div class="urgency-row">
      <button class="urgency-btn" data-level="low"      onclick="selectUrgency(this)">Low</button>
      <button class="urgency-btn" data-level="medium"   onclick="selectUrgency(this)">Medium</button>
      <button class="urgency-btn" data-level="high"     onclick="selectUrgency(this)">High</button>
      <button class="urgency-btn" data-level="critical" onclick="selectUrgency(this)">Critical</button>
    </div>
  </div>

  <button class="submit-btn" onclick="submitTicket()">Submit ticket</button>

  <div class="success-msg" id="success-msg">
    ✓ Ticket submitted successfully. <strong id="ticket-ref"></strong>
  </div>
</div>

<p class="admin-link">Staff? <a href="admin.html">Go to admin dashboard →</a></p>

<footer class="footer">
  <span>📞 <a href="tel:+35020050630">+350 200 50630 x 820</a></span>
  <span>✉️ <a href="mailto:helpdesk@YOUR_GITHUB_USERNAME.com">helpdesk@YOUR_GITHUB_USERNAME.com</a></span>
</footer>

<script>
  let selectedUrgency = '';

  function selectUrgency(btn) {
    document.querySelectorAll('.urgency-btn').forEach(b => b.className = 'urgency-btn');
    selectedUrgency = btn.dataset.level;
    btn.classList.add('sel-' + selectedUrgency);
  }

  function submitTicket() {
    const name  = document.getElementById('f-name').value.trim();
    const phone = document.getElementById('f-phone').value.trim();
    const email = document.getElementById('f-email').value.trim();
    const desc  = document.getElementById('f-desc').value.trim();
    if (!name || !phone || !email || !desc || !selectedUrgency) {
      alert('Please fill in all fields and select an urgency level.');
      return;
    }
    const tickets = JSON.parse(localStorage.getItem('em_tickets') || '[]');
    const maxId   = tickets.reduce((max, t) => Math.max(max, parseInt(t.id.replace('TK-','')) || 0), 0);
    const id      = 'TK-' + String(maxId + 1).padStart(3, '0');
    const now     = new Date();
    tickets.unshift({ id, name, phone, email, desc, urgency: selectedUrgency, status: 'Open', date: now.toISOString().slice(0,10), time: now.toISOString() });
    localStorage.setItem('em_tickets', JSON.stringify(tickets));
    localStorage.setItem('em_next_id', String(maxId + 2));

    document.getElementById('f-name').value  = '';
    document.getElementById('f-phone').value = '';
    document.getElementById('f-email').value = '';
    document.getElementById('f-desc').value  = '';
    document.querySelectorAll('.urgency-btn').forEach(b => b.className = 'urgency-btn');
    selectedUrgency = '';
    document.getElementById('ticket-ref').textContent = 'Reference: ' + id;
    const sm = document.getElementById('success-msg');
    sm.style.display = 'block';
    setTimeout(() => sm.style.display = 'none', 6000);
  }
</script>
</body>
</html>
